<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon6AutoGear - 远程调试界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status-bar {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .connection-status {
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
        }

        .connected {
            background: #4caf50;
        }

        .disconnected {
            background: #f44336;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            flex: 1;
        }

        .gauge {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .gauge h2 {
            font-size: 1em;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .gauge .value {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .controls {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .controls h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        .d-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .d-pad-row {
            display: flex;
            gap: 10px;
        }

        .key-btn {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            background: rgba(255,255,255,0.1);
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .key-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .key-btn.active {
            background: #4caf50;
            transform: scale(0.95);
        }

        .key-btn:active {
            transform: scale(0.9);
        }

        .logs {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            backdrop-filter: blur(10px);
        }

        .logs h3 {
            margin-bottom: 10px;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .info-text {
            text-align: center;
            opacity: 0.8;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏎️ Horizon6AutoGear 远程调试</h1>
        </div>

        <div class="status-bar">
            <div>
                <span id="connection-status" class="connection-status disconnected">未连接</span>
            </div>
            <div>
                <input type="text" id="ws-url" value="ws://localhost:8765"
                       placeholder="WebSocket地址"
                       style="padding: 8px; border-radius: 5px; border: none;">
                <input type="password" id="auth-token" value=""
                       placeholder="认证Token"
                       style="padding: 8px; border-radius: 5px; border: none; margin-left: 5px;">
                <button onclick="connect()"
                        style="padding: 8px 16px; margin-left: 10px; border: none; border-radius: 5px; cursor: pointer; background: #4caf50; color: white; font-weight: bold;">
                    连接
                </button>
            </div>
        </div>

        <div class="dashboard">
            <div class="gauge">
                <h2>档位</h2>
                <div class="value" id="gear">-</div>
            </div>

            <div class="gauge">
                <h2>转速 (RPM)</h2>
                <div class="value" id="rpm">-</div>
            </div>

            <div class="gauge">
                <h2>速度 (km/h)</h2>
                <div class="value" id="speed">-</div>
            </div>

            <div class="gauge">
                <h2>轮胎滑动 (后左)</h2>
                <div class="value" id="tire-rl">-</div>
            </div>
        </div>

        <div class="controls">
            <h3>车辆控制 (按键)</h3>
            <div class="d-pad">
                <button id="key-w"
                        class="key-btn"
                        onmousedown="sendKey('w', 'press')"
                        onmouseup="sendKey('w', 'release')"
                        ontouchstart="sendKey('w', 'press')"
                        ontouchend="sendKey('w', 'release')">
                    W<br>加速
                </button>
                <div class="d-pad-row">
                    <button id="key-a"
                            class="key-btn"
                            onmousedown="sendKey('a', 'press')"
                            onmouseup="sendKey('a', 'release')"
                            ontouchstart="sendKey('a', 'press')"
                            ontouchend="sendKey('a', 'release')">
                        A<br>左转
                    </button>
                    <button id="key-s"
                            class="key-btn"
                            onmousedown="sendKey('s', 'press')"
                            onmouseup="sendKey('s', 'release')"
                            ontouchstart="sendKey('s', 'press')"
                            ontouchend="sendKey('s', 'release')">
                        S<br>刹车
                    </button>
                    <button id="key-d"
                            class="key-btn"
                            onmousedown="sendKey('d', 'press')"
                            onmouseup="sendKey('d', 'release')"
                            ontouchstart="sendKey('d', 'press')"
                            ontouchend="sendKey('d', 'release')">
                        D<br>右转
                    </button>
                </div>
            </div>
            <p class="info-text">或使用键盘直接按键</p>
        </div>

        <div class="logs">
            <h3>日志</h3>
            <div id="log-output"></div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
